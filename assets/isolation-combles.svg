<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t">
  <title id="t">Illustration : maison en coupe avec une couche d'isolant posée sur le plancher des combles</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9eef5"/>
      <stop offset="1" stop-color="#f3faf5"/>
    </linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3dc"/>
      <stop offset="1" stop-color="#fde6c0"/>
    </linearGradient>
    <pattern id="wool" width="28" height="18" patternUnits="userSpaceOnUse">
      <rect width="28" height="18" fill="#f7cf5a"/>
      <path d="M0 9 q7 -8 14 0 t14 0" fill="none" stroke="#e2a92a" stroke-width="2.2"/>
      <path d="M-7 18 q7 -8 14 0 t14 0 t14 0" fill="none" stroke="#efbd3c" stroke-width="1.6"/>
    </pattern>
    <clipPath id="attic">
      <polygon points="196,330 400,170 604,330"/>
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="676" cy="96" r="44" fill="#fbd157"/>
  <circle cx="676" cy="96" r="60" fill="#fbd157" opacity=".25"/>
  <path d="M0 528 Q200 500 400 520 T800 512 V600 H0 Z" fill="#8cc79a"/>
  <path d="M0 548 Q220 528 420 544 T800 540 V600 H0 Z" fill="#6fb282"/>

  <!-- Cheminée -->
  <rect x="520" y="168" width="38" height="96" fill="#9c4a2c"/>
  <rect x="512" y="160" width="54" height="14" rx="3" fill="#7d3a22"/>

  <!-- Toiture -->
  <polygon points="140,336 400,128 660,336" fill="#c8643b"/>
  <polygon points="140,336 400,128 660,336 640,340 400,148 160,340" fill="#a94f2c"/>
  <!-- Combles (vue en coupe) -->
  <polygon points="196,330 400,170 604,330" fill="#fff8ee"/>
  <!-- Charpente -->
  <g stroke="#b88a5a" stroke-width="6" stroke-linecap="round">
    <line x1="400" y1="176" x2="400" y2="326"/>
    <line x1="300" y1="252" x2="300" y2="326"/>
    <line x1="500" y1="252" x2="500" y2="326"/>
  </g>
  <!-- Isolant sur le plancher des combles -->
  <g clip-path="url(#attic)">
    <rect x="190" y="282" width="420" height="48" fill="url(#wool)"/>
    <path d="M190 284 q12 -10 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0" fill="#f7cf5a" stroke="#e2a92a" stroke-width="2"/>
  </g>
  <!-- Plancher -->
  <rect x="186" y="330" width="428" height="12" fill="#a8774a"/>

  <!-- Murs et pièce à vivre -->
  <rect x="186" y="342" width="428" height="184" fill="url(#room)"/>
  <rect x="172" y="336" width="14" height="190" fill="#e6d6c2"/>
  <rect x="614" y="336" width="14" height="190" fill="#e6d6c2"/>
  <!-- Fenêtre -->
  <rect x="236" y="380" width="92" height="84" rx="4" fill="#bfe3f0" stroke="#ffffff" stroke-width="6"/>
  <line x1="282" y1="380" x2="282" y2="464" stroke="#ffffff" stroke-width="5"/>
  <line x1="236" y1="422" x2="328" y2="422" stroke="#ffffff" stroke-width="5"/>
  <!-- Canapé -->
  <rect x="452" y="452" width="128" height="44" rx="10" fill="#2f7d63"/>
  <rect x="444" y="436" width="20" height="60" rx="8" fill="#256650"/>
  <rect x="568" y="436" width="20" height="60" rx="8" fill="#256650"/>
  <rect x="452" y="496" width="10" height="18" fill="#1d4f3f"/>
  <rect x="570" y="496" width="10" height="18" fill="#1d4f3f"/>
  <!-- Radiateur -->
  <rect x="356" y="456" width="64" height="44" rx="6" fill="#ffffff" stroke="#d7c7b2" stroke-width="3"/>
  <g stroke="#d7c7b2" stroke-width="3"><line x1="372" y1="460" x2="372" y2="496"/><line x1="388" y1="460" x2="388" y2="496"/><line x1="404" y1="460" x2="404" y2="496"/></g>

  <!-- La chaleur reste dans le logement -->
  <g fill="none" stroke="#e0622f" stroke-width="4.5" stroke-linecap="round" opacity=".9">
    <path d="M372 446 c -10 -14, 10 -26, 0 -40 s 10 -26, 0 -40"/>
    <path d="M388 446 c -10 -14, 10 -26, 0 -40 s 10 -26, 0 -40 s 10 -16, 0 -24"/>
    <path d="M404 446 c -10 -14, 10 -26, 0 -40 s 10 -26, 0 -40"/>
  </g>
  <rect x="186" y="526" width="442" height="8" fill="#cbb79e"/>
</svg>
